<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Billiard</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090D16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css?v=3" />
  </head>
  <body>
    <div class="app">
      <main class="content">
        <!-- STOLLAR TAB -->
        <section id="tab-tables" class="tab-pane active">
          <header class="app-header">
            <div class="header-left">
              <h1>Billiard</h1>
              <span class="status-dot"></span>
            </div>
            <div class="header-right">
              <div class="revenue-val" id="dailyRevenue">0 so'm</div>
              <div class="occupied-val" id="occupiedCount">Band: 0/4</div>
            </div>
          </header>
          <div class="grid" id="tablesGrid"></div>
        </section>

        <!-- BAR TAB -->
        <section id="tab-bar" class="tab-pane">
          <div class="segment-control tab-segment">
            <button class="seg-btn active" data-view="bar-sell-view">
              Sotish
            </button>
            <button class="seg-btn" data-view="bar-menu-view">Menyu</button>
          </div>

          <div id="bar-sell-view" class="view-pane active">
            <div class="field-group">
              <label>Qaysi stolga:</label>
              <div id="barOrderTableSelect" class="table-chip-list"></div>
            </div>
            <div id="barOrderItems" class="bar-items-list"></div>

            <div class="sticky-bottom-bar" id="barStickyPanel">
              <div class="row">
                <span>Jami:</span><b id="barOrderTotalAmount">0 so'm</b>
              </div>
              <button class="btn btn-primary" id="confirmBarOrderBtn">
                Sotish
              </button>
            </div>
          </div>

          <div id="bar-menu-view" class="view-pane">
            <div class="menu-add-form">
              <input
                type="text"
                id="barItemName"
                class="input"
                placeholder="Mahsulot nomi"
              />
              <div class="row-inputs">
                <input
                  type="number"
                  id="barItemPrice"
                  class="input"
                  placeholder="Narxi"
                  inputmode="numeric"
                />
                <select id="barItemCategory" class="input">
                  <option value="ichimlik">Ichimlik</option>
                  <option value="taom">Taom</option>
                  <option value="boshqa">Boshqa</option>
                </select>
              </div>
              <button class="btn btn-primary" id="addBarItemBtn">
                Qo'shish
              </button>
            </div>
            <div id="barItemsList" class="menu-items-list"></div>
          </div>
        </section>

        <!-- TARIX TAB -->
        <section id="tab-history" class="tab-pane">
          <div class="history-top-bar" style="display: flex; gap: 12px; margin-bottom: 16px; align-items: center;">
            <div class="segment-control tab-segment" style="flex: 1; margin-bottom: 0;">
              <button class="seg-btn active" data-view="hist-today-view">
                Bugun
              </button>
              <button class="seg-btn" data-view="hist-month-view">Oy</button>
            </div>
            <button class="btn btn-outline btn-sm" id="exportBtn" style="width: auto; height: 40px; border-color: var(--border-soft);">
              <svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
            </button>
          </div>

          <div id="hist-today-view" class="view-pane active">
            <div class="history-summary">
              <span id="historyCountLabel">0 ta o'yin</span>
            </div>
            <div id="historyWrap" class="history-list"></div>
          </div>

          <div id="hist-month-view" class="view-pane" style="display: none">
            <div id="monthlyArchiveList" class="history-list"></div>
          </div>
        </section>

        <!-- SOZLAMALAR TAB -->
        <section id="tab-settings" class="tab-pane">
          <h2 class="page-title">Sozlamalar</h2>
          <div class="settings-card">
            <label>Soatbay narx (so'm/soat)</label>
            <div class="row">
              <input
                type="number"
                id="hourlyRate"
                class="input"
                inputmode="numeric"
              />
              <button
                class="btn btn-primary"
                id="saveRateBtn"
                style="width: auto"
              >
                Saqlash
              </button>
            </div>
            <div id="saveNote" class="save-note">Saqlandi ✓</div>
          </div>

          <div class="settings-card">
            <label>Arxiv va Ma'lumotlar</label>
            <div
              class="row"
              style="flex-direction: column; gap: 8px; margin-top: 8px"
            >
              <button class="btn btn-outline" id="dailyArchiveBtn">
                Kunlik arxivlar (Tarix)
              </button>
            </div>
          </div>

          <div class="version">v2.0</div>
        </section>
      </main>

      <!-- BOTTOM NAV -->
      <nav class="bottom-nav">
        <button class="nav-item active" data-target="tab-tables">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <path d="M3 9h18" />
            <path d="M9 21V9" />
          </svg>
          <span>Stollar</span>
        </button>
        <button class="nav-item" data-target="tab-bar">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M17 8h1a4 4 0 1 1 0 8h-1" />
            <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" />
            <line x1="6" x2="6" y1="2" y2="4" />
            <line x1="10" x2="10" y1="2" y2="4" />
            <line x1="14" x2="14" y1="2" y2="4" />
          </svg>
          <span>Bar</span>
        </button>
        <button class="nav-item" data-target="tab-history">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          <span>Tarix</span>
        </button>
        <button class="nav-item" data-target="tab-settings">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span>Sozlamalar</span>
        </button>
      </nav>

      <!-- BOTTOM SHEET (Checkout) -->
      <div class="bottom-sheet-overlay" id="checkoutSheetOverlay">
        <div class="bottom-sheet">
          <div class="sheet-header">
            <h3 id="sheetTitle">1-stol</h3>
          </div>
          <div class="sheet-content">
            <div class="sheet-row">
              <span>Davomiylik:</span> <b id="sheetDuration">00:00:00</b>
            </div>
            <div class="sheet-row">
              <span>O'yin summasi:</span> <b id="sheetGameAmount">0 so'm</b>
            </div>
            <div class="sheet-row" id="sheetBarRow">
              <span>Bar summasi:</span> <b id="sheetBarAmount">0 so'm</b>
            </div>

            <div class="sheet-total">
              JAMI: <span id="sheetTotalAmount">0 so'm</span>
            </div>

            <div class="sheet-field">
              <label>Mijoz ismi (ixtiyoriy)</label>
              <input
                type="text"
                id="sheetCustomerName"
                class="input"
                placeholder="Ism"
              />
            </div>

            <div class="sheet-segment" id="paymentMethodSeg">
              <button class="seg-btn active" data-type="cash">Naqd</button>
              <button class="seg-btn" data-type="card">Karta</button>
            </div>

            <div class="sheet-actions">
              <button class="btn btn-secondary" id="sheetCancelBtn">
                Bekor qilish
              </button>
              <button class="btn btn-danger" id="sheetConfirmBtn">
                Tasdiqlash va yopish
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-overlay" id="customDialogOverlay">
        <div class="modal-box report-box">
          <h3 id="customDialogMessage">Xabar</h3>
          <div class="dialog-actions">
            <button class="btn btn-secondary" id="customDialogCancelBtn">
              Bekor qilish
            </button>
            <button class="btn btn-danger" id="customDialogConfirmBtn">
              Tasdiqlash
            </button>
          </div>
        </div>
      </div>

      <div class="modal-overlay" id="dailyArchiveOverlay">
        <div class="modal-box report-box">
          <h3>Kunlik arxivlar</h3>
          <div id="dailyArchiveList" class="history-list"></div>
          <button
            class="btn btn-secondary"
            id="closeDailyArchiveBtn"
            style="margin-top: 12px; width: 100%"
          >
            Yopish
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
